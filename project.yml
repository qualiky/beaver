name: Beaver
options:
  bundleIdPrefix: dev.beaver
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  BeaverCore:
    path: Packages/BeaverCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0
targets:
  Beaver:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Beaver
    dependencies:
      - package: BeaverCore
        product: BeaverCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BEAVER_BUNDLE_ID)
        PRODUCT_NAME: Beaver
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beaver
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  BeaverTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BeaverTests
    dependencies:
      - target: Beaver
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BEAVER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Beaver:
    build:
      targets:
        Beaver: all
        BeaverTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeaverTests
    archive:
      config: Release
